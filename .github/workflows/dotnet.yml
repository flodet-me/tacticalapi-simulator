name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Weekly build to catch upstream TacticalAPI contract changes early
    # (see the contract-drift-check job below, which builds against HEAD).
    - cron: "0 6 * * 1"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Single job for everything that needs a restored solution: format, NuGet
  # vulnerability scan, build+test+coverage, SBOM+license check, and
  # publishing each executable as a downloadable artifact. Kept as one job
  # (rather than separate format-check/sbom jobs) so there's exactly one
  # checkout/restore instead of three - the trade-off is that a formatting
  # typo now fails after the full pipeline runs instead of in ~15 seconds.
  # Docker image build/scan/SBOM for each of the four executables lives in
  # the separate docker-images job below - those steps are self-contained
  # (see docs/CI.md) and don't need anything from here except the version
  # metadata this job computes.
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ steps.version.outputs.full_version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      artifact_suffix: ${{ steps.version.outputs.artifact_suffix }}
    steps:
      - name: Checkout (including TacticalAPI submodule)
        uses: actions/checkout@v7
        with:
          # Pulls external/tacticalapi (Rheinmetall/tacticalapi) at the
          # commit pinned in this repository.
          submodules: recursive
          fetch-depth: 1

      - name: Verify TacticalAPI protos are present
        run: test -f external/tacticalapi/rheinmetall/tactical_api/v0/situation_service.proto

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env

      - name: Restore
        run: dotnet restore

      - name: Check formatting (C#)
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Check formatting (*.nix)
        run: |
          set -euo pipefail
          # Pinned to the same nixfmt version .nix/shell.nix's nixpkgs input
          # resolves today, so this step and a contributor's local `nix fmt`
          # agree - see docs/CI.md. Not run via Nix itself: this workflow
          # otherwise needs no Nix install (see docs/NIX.md), so this fetches
          # NixOS/nixfmt's standalone static binary release instead.
          curl -sL -o nixfmt "https://github.com/NixOS/nixfmt/releases/download/v1.2.0/nixfmt"
          echo "aa43e06e2e98d07f9393a8dc73978e0df79bad15d7f84fcd838e15557eb056ee  nixfmt" | sha256sum -c -
          chmod +x nixfmt
          ./nixfmt --check $(git ls-files '*.nix')

      - name: Check formatting (all tracked files vs .editorconfig)
        run: |
          set -euo pipefail
          # editorconfig-checker enforces charset/EOL/trailing-whitespace/final-newline
          # for every tracked file, not just the C# .cs formats dotnet format covers
          # above. Its Indentation/IndentSize checks are disabled repo-wide (see
          # .editorconfig-checker.json) - that naive check flags markdown code-fence
          # content and aligned multi-line C#/Dockerfile continuations as violations
          # even though they're valid, so real indentation correctness for .cs and
          # .nix is left to dotnet format and nixfmt above instead. See docs/CI.md.
          EC_VERSION=3.8.0
          curl -sL -o ec.tar.gz "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EC_VERSION}/ec-linux-amd64.tar.gz"
          echo "613bd88f34165a334adcb6b7e92a123c9de0eada65846d31af63613b779ff3be  ec.tar.gz" | sha256sum -c -
          tar -xzf ec.tar.gz bin/ec-linux-amd64
          ./bin/ec-linux-amd64

      - name: Scan for vulnerable NuGet packages
        run: |
          # NuGetAuditMode=all (Directory.Build.props) already fails restore/build
          # on a detected vulnerability via TreatWarningsAsErrors; this step gives
          # it a dedicated, readable report instead of a buried build warning.
          dotnet list package --vulnerable --include-transitive | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::error::Vulnerable NuGet package(s) detected - see the report above."
            exit 1
          fi
          echo "No vulnerable NuGet packages found."

      - name: Compute build version
        id: version
        run: |
          # Directory.Build.props is the single source of truth for the base
          # version; CI only appends the run number + commit sha.
          version_prefix=$(dotnet msbuild src/simulator/TacticalApi.Simulator.Host/TacticalApi.Simulator.Host.csproj -getProperty:VersionPrefix)
          short_sha="${GITHUB_SHA::7}"
          version_suffix="ci.${{ github.run_number }}+${short_sha}"
          artifact_suffix="${{ github.run_number }}-${short_sha}"
          full_version="${version_prefix}-${version_suffix}"
          echo "version_suffix=${version_suffix}" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=${artifact_suffix}" >> "$GITHUB_OUTPUT"
          echo "full_version=${full_version}" >> "$GITHUB_OUTPUT"
          # Docker tags don't allow "+", unlike semver build metadata.
          echo "image_tag=${version_prefix}-${artifact_suffix}" >> "$GITHUB_OUTPUT"
          echo "Version: ${full_version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:VersionSuffix=${{ steps.version.outputs.version_suffix }}

      - name: Test (unit + E2E, with coverage)
        run: >
          dotnet test --configuration Release --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Merge coverage reports
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.10
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coveragereport \
            -reporttypes:"Cobertura;MarkdownSummaryGithub"
          cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage gate (>= 80% line coverage)
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          import sys
          root = ET.parse("coveragereport/Cobertura.xml").getroot()
          rate = float(root.get("line-rate")) * 100
          print(f"Line coverage: {rate:.2f}% (gate: 80%)")
          sys.exit(0 if rate >= 80.0 else 1)
          EOF

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ steps.version.outputs.artifact_suffix }}
          path: coveragereport
          if-no-files-found: ignore

      - name: Generate SBOM (CycloneDX)
        run: |
          # Scoped to the Host, every Adapter.*, and their Sources.* dependencies
          # (excludes dev/test-only tooling) - what's actually in the Docker
          # images, not the whole solution. --exclude-dev drops packages the
          # NuGet convention marks <developmentDependency>true</developmentDependency>
          # (e.g. SonarAnalyzer.CSharp, Directory.Build.props - a build-time-only
          # Roslyn analyzer, PrivateAssets="all", never published into the image);
          # without it the license-allow-list step below fails on such a package's
          # license even though nothing ships it.
          dotnet tool install --global CycloneDX --version 6.2.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet-CycloneDX TacticalApi.Simulator.slnx \
            --exclude-test-projects \
            --exclude-dev \
            --set-version "${{ steps.version.outputs.full_version }}" \
            --output-format Json \
            --output .

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ steps.version.outputs.artifact_suffix }}
          path: bom.json

      - name: Enforce license allow-list
        run: |
          python3 - <<'EOF'
          import json
          import sys

          ALLOWED = {"MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD"}

          with open("bom.json") as f:
              bom = json.load(f)

          violations = []
          for component in bom.get("components", []):
              label = f"{component['name']}@{component['version']}"
              licenses = component.get("licenses", [])
              # CycloneDX allows two shapes per entry: a discrete {"license": {...}}
              # or an SPDX {"expression": "..."}; only the former has an "id"/"name".
              ids = []
              for entry in licenses:
                  if "license" in entry:
                      ids.append(entry["license"].get("id") or entry["license"].get("name"))
                  elif "expression" in entry:
                      ids.append(entry["expression"])
              if not ids:
                  violations.append(f"{label}: no license metadata")
              elif not any(lic in ALLOWED for lic in ids):
                  violations.append(f"{label}: disallowed license(s) {ids}")

          component_count = len(bom.get("components", []))
          if violations:
              print(f"License check FAILED ({len(violations)} of {component_count} components):")
              for v in violations:
                  print(f"  - {v}")
              sys.exit(1)

          print(f"License check passed: {component_count} components, all within {sorted(ALLOWED)}.")
          EOF

      - name: Publish host
        run: dotnet publish src/simulator/TacticalApi.Simulator.Host --configuration Release --no-build --output ./publish/host

      - name: Publish adapter (OpenSky)
        run: dotnet publish src/adapter/TacticalApi.Simulator.Adapter.OpenSky --configuration Release --no-build --output ./publish/adapter-opensky

      - name: Publish adapter (NWS)
        run: dotnet publish src/adapter/TacticalApi.Simulator.Adapter.Nws --configuration Release --no-build --output ./publish/adapter-nws

      - name: Publish adapter (Synthetic)
        run: dotnet publish src/adapter/TacticalApi.Simulator.Adapter.Synthetic --configuration Release --no-build --output ./publish/adapter-synthetic

      - name: Upload host artifact
        uses: actions/upload-artifact@v7
        with:
          name: tacticalapi-simulator-host-${{ steps.version.outputs.artifact_suffix }}
          path: ./publish/host

      - name: Upload adapter artifact (OpenSky)
        uses: actions/upload-artifact@v7
        with:
          name: tacticalapi-simulator-adapter-opensky-${{ steps.version.outputs.artifact_suffix }}
          path: ./publish/adapter-opensky

      - name: Upload adapter artifact (NWS)
        uses: actions/upload-artifact@v7
        with:
          name: tacticalapi-simulator-adapter-nws-${{ steps.version.outputs.artifact_suffix }}
          path: ./publish/adapter-nws

      - name: Upload adapter artifact (Synthetic)
        uses: actions/upload-artifact@v7
        with:
          name: tacticalapi-simulator-adapter-synthetic-${{ steps.version.outputs.artifact_suffix }}
          path: ./publish/adapter-synthetic

  # Builds, CVE-scans, and SBOMs each of the four container images (the Host
  # server and every Adapter.*) in parallel via a matrix - each executable has
  # its own colocated Dockerfile (src/<project>/Dockerfile), not shared build
  # stages selected by --target, so a project's container build lives with
  # its own code. A separate job rather than more build-and-test steps: each
  # `docker build` already redoes its own restore/build/publish from scratch
  # (see docs/CI.md) - it needs nothing build-and-test produced, only the
  # version metadata already computed there.
  docker-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Explicit block, not just the default: setting `permissions` at all
    # replaces the default GITHUB_TOKEN grant for this job rather than
    # extending it, so contents:read has to be restated alongside
    # packages:write (needed by the GHCR push steps below) or checkout breaks.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: host
            dockerfile: src/simulator/TacticalApi.Simulator.Host/Dockerfile
            image: tacticalapi-simulator
          - name: adapter-opensky
            dockerfile: src/adapter/TacticalApi.Simulator.Adapter.OpenSky/Dockerfile
            image: tacticalapi-simulator-adapter-opensky
          - name: adapter-nws
            dockerfile: src/adapter/TacticalApi.Simulator.Adapter.Nws/Dockerfile
            image: tacticalapi-simulator-adapter-nws
          - name: adapter-synthetic
            dockerfile: src/adapter/TacticalApi.Simulator.Adapter.Synthetic/Dockerfile
            image: tacticalapi-simulator-adapter-synthetic
    steps:
      - name: Checkout (including TacticalAPI submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build Docker image
        run: >
          docker build
          -f ${{ matrix.dockerfile }}
          --build-arg VERSION=${{ needs.build-and-test.outputs.full_version }}
          --tag ${{ matrix.image }}:${{ needs.build-and-test.outputs.image_tag }}
          .

      - name: Smoke-test container
        # Only the Host actually listens on a port - the three adapters are
        # plain outbound-push console apps with no HTTP surface to hit here.
        # Runs on every build (PRs included), not just pushes to main - this
        # is a build-correctness check, not a publish step.
        if: matrix.name == 'host'
        run: |
          set -euo pipefail
          container_id=$(docker run -d -p 4268:4268 ${{ matrix.image }}:${{ needs.build-and-test.outputs.image_tag }})
          cleanup() { docker logs "$container_id" || true; docker rm -f "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          echo "Waiting for the container's own HEALTHCHECK to report healthy..."
          for i in $(seq 1 24); do
            health="$(docker inspect --format='{{.State.Health.Status}}' "$container_id")"
            if [ "$health" = "healthy" ]; then
              echo "Healthy after ~$((i * 10))s."
              break
            fi
            if [ "$health" = "unhealthy" ]; then
              echo "::error::Container reported unhealthy."
              exit 1
            fi
            if [ "$i" -eq 24 ]; then
              echo "::error::Container never reported healthy within 240s."
              exit 1
            fi
            sleep 10
          done

          echo "Confirming /healthz is reachable from outside the container too."
          curl -sf http://localhost:4268/healthz

      - name: Log in to GHCR
        # Only push from main - never from a pull_request build (this
        # workflow's `push` trigger is already scoped to `branches: [ main ]`,
        # see the top of this file).
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Get current date for Trivy DB cache key
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability database
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/trivy-cache
          # Trivy does a delta update against whatever DB is already present
          # in this dir, so a same-day cache hit skips the ~100-200MB full
          # download; restore-keys falls back to the latest older cache
          # (still much cheaper than downloading from scratch) on a miss.
          key: trivy-db-${{ steps.date.outputs.date }}
          restore-keys: trivy-db-

      - name: Scan Docker image for vulnerabilities
        run: |
          # Official Trivy image straight from Docker Hub, scanning the local
          # image via the mounted Docker socket - no GitHub API, no token.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ runner.temp }}/trivy-cache:/root/.cache/trivy \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            ${{ matrix.image }}:${{ needs.build-and-test.outputs.image_tag }}

      - name: Push image to GHCR
        # Runs after the vulnerability scan above (which exits 1 on any
        # CRITICAL/HIGH finding) - a failing scan stops the job before this
        # step, so nothing scan-flagged ever reaches the registry.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # GHCR requires an all-lowercase path; github.repository_owner
          # preserves whatever case the account/org name actually has.
          owner_lower=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image_ref="ghcr.io/${owner_lower}/${{ matrix.image }}"
          docker tag ${{ matrix.image }}:${{ needs.build-and-test.outputs.image_tag }} "${image_ref}:${{ needs.build-and-test.outputs.image_tag }}"
          docker tag ${{ matrix.image }}:${{ needs.build-and-test.outputs.image_tag }} "${image_ref}:latest"
          docker push "${image_ref}:${{ needs.build-and-test.outputs.image_tag }}"
          docker push "${image_ref}:latest"

      - name: Generate Docker image SBOM
        run: |
          # Covers what the source-level SBOM above can't see: the OS base
          # image's packages (mcr.microsoft.com/dotnet/aspnet for the host,
          # the smaller mcr.microsoft.com/dotnet/runtime for adapters - plain
          # console apps, no ASP.NET Core needed), not just the .NET/NuGet
          # dependency graph.
          # Written to stdout rather than via -v <path>:/out - that bind mount
          # is resolved by the Docker daemon, not this shell, and the two
          # disagree on paths under act's nested-container setup.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ runner.temp }}/trivy-cache:/root/.cache/trivy \
            aquasec/trivy:latest image \
            --format cyclonedx \
            ${{ matrix.image }}:${{ needs.build-and-test.outputs.image_tag }} \
            > image-sbom.json

      - name: Upload Docker image SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-sbom-${{ matrix.name }}-${{ needs.build-and-test.outputs.artifact_suffix }}
          path: image-sbom.json

  # Builds against the LATEST upstream TacticalAPI contract (submodule moved
  # to origin/main) without committing anything. Fails when an upstream proto
  # change breaks the simulator - your early warning for contract drift.
  contract-drift-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Move submodule to upstream HEAD
        run: git submodule update --init --remote external/tacticalapi

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env

      - name: Build against latest contract
        run: dotnet build --configuration Release
