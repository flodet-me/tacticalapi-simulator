<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TacticalAPI Simulator — Situation Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <style>
    :root {
      --bg: #0b0e13;
      --panel: rgba(20, 24, 31, 0.82);
      --panel-solid: #141821;
      --border: #262c37;
      --text: #e4e7eb;
      --muted: #8b93a1;
      --accent: #22d3ee;
      --accent-dim: rgba(34, 211, 238, 0.15);
      --sidebar-width: 360px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.65rem 1rem;
      background: var(--panel);
      backdrop-filter: blur(14px) saturate(150%);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }
    header .logo { color: var(--accent); flex-shrink: 0; display: flex; }
    header h1 { font-size: 0.95rem; font-weight: 650; margin: 0; letter-spacing: 0.01em; }
    header .status { margin-left: auto; font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
    header .status.error { color: #ff6b6b; }
    header .status .dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); margin-right: 0.4rem; box-shadow: 0 0 6px var(--accent);
    }
    header .status.error .dot { background: #ff6b6b; box-shadow: 0 0 6px #ff6b6b; }
    #sidebar-toggle {
      display: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 1rem;
      line-height: 1;
      padding: 0.35rem 0.55rem;
      cursor: pointer;
    }
    main { flex: 1; display: flex; min-height: 0; position: relative; }
    #map { flex: 1; }
    #backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 900;
    }
    #sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      backdrop-filter: blur(14px) saturate(150%);
      border-left: 1px solid var(--border);
      overflow: hidden;
    }
    #filters {
      padding: 0.65rem 0.8rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    #search {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.4rem 0.55rem;
      font-size: 0.82rem;
    }
    #search:focus { outline: none; border-color: var(--accent); }
    #type-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem 0.25rem 0.5rem;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .chip .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .chip.active { color: var(--text); background: rgba(255, 255, 255, 0.07); }
    #sidebar .count {
      padding: 0.5rem 0.8rem; font-size: 0.75rem; color: var(--muted);
      border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.04em;
    }
    #object-list { flex: 1; overflow-y: auto; }
    .row { border-bottom: 1px solid var(--border); font-size: 0.82rem; border-left: 3px solid transparent; }
    .row.selected { border-left-color: var(--accent); background: rgba(34, 211, 238, 0.06); }
    .row-main { display: flex; align-items: center; gap: 0.45rem; padding: 0.55rem 0.8rem; cursor: pointer; }
    .row-main:hover { background: rgba(255, 255, 255, 0.03); }
    .row-symbol { flex-shrink: 0; width: 20px; height: 20px; }
    .row-symbol svg { width: 100%; height: 100%; }
    .row .type-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .row .type-label {
      font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--muted); flex-shrink: 0;
    }
    .row .name { color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .locate {
      flex-shrink: 0;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.1rem 0.3rem;
    }
    .row .locate:hover { color: var(--accent); }
    .row-id { color: var(--muted); font-size: 0.7rem; padding: 0 0.8rem 0.45rem 0.8rem; font-family: ui-monospace, monospace; }
    .row-progress { padding: 0 0.8rem 0.45rem 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
    .row-progress .bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    .row-progress .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
    .row-progress .pill {
      font-size: 0.62rem; font-weight: 700; padding: 0.1rem 0.45rem; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.03em; flex-shrink: 0;
    }
    .row-details {
      padding: 0.2rem 0.8rem 0.7rem 0.8rem;
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.2rem 0.7rem;
      font-size: 0.78rem;
    }
    .row-details dt { color: var(--muted); }
    .row-details dd { margin: 0; word-break: break-word; white-space: pre-line; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel-solid); color: var(--text); }
    .leaflet-container { background: #060809; }
    .leaflet-control-zoom a {
      background: var(--panel-solid) !important; color: var(--text) !important; border-color: var(--border) !important;
    }
    .leaflet-control-zoom a:hover { background: #1c222c !important; }
    .leaflet-control-attribution { background: rgba(20, 24, 31, 0.7) !important; color: var(--muted) !important; }
    .leaflet-control-attribution a { color: var(--muted) !important; }
    .popup .type { font-weight: 700; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); }
    .popup .name { font-size: 0.92rem; font-weight: 600; margin-top: 0.15rem; }
    .popup .field { color: var(--muted); font-size: 0.78rem; margin-top: 0.15rem; }
    .popup .details { max-height: 200px; overflow-y: auto; margin-top: 0.5rem; border-top: 1px solid var(--border); padding-top: 0.4rem; }
    .popup .details dt { color: var(--muted); font-size: 0.72rem; }
    .popup .details dd { margin: 0 0 0.3rem 0; font-size: 0.78rem; white-space: pre-line; }
    .milsymbol-icon { background: transparent; border: none; }
    .waypoint-badge {
      background: var(--panel-solid); border: 1.5px solid var(--accent); color: var(--text);
      border-radius: 999px; font-size: 0.62rem; font-weight: 700; text-align: center;
      line-height: 18px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }
    .task-ring-icon { display: flex; align-items: center; justify-content: center; }
    .task-ring-icon .ring {
      width: 100%; height: 100%; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .task-ring-icon .hub { width: 55%; height: 55%; border-radius: 50%; background: var(--panel-solid); }

    /* Flowing dash animation for routes/corridors - a small "alive" touch. */
    path.flow-line { animation: dash-flow 1.1s linear infinite; }
    @keyframes dash-flow { to { stroke-dashoffset: -16; } }

    /* Pulsing halo marking whichever object is selected (from either the sidebar or the map). */
    .pulse-marker { position: relative; width: 22px; height: 22px; }
    .pulse-marker .core {
      position: absolute; left: 7px; top: 7px; width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 6px var(--accent);
    }
    .pulse-marker .ring {
      position: absolute; left: 1px; top: 1px; width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--accent); animation: pulse-ring 1.4s ease-out infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.3); opacity: 0.9; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    @media (max-width: 820px) {
      #sidebar-toggle { display: inline-block; }
      #sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(88vw, 380px);
        transform: translateX(100%);
        transition: transform 0.25s ease;
        z-index: 950;
        box-shadow: -6px 0 20px rgba(0, 0, 0, 0.6);
      }
      body.sidebar-open #sidebar { transform: translateX(0); }
      body.sidebar-open #backdrop { display: block; }
    }
  </style>
</head>
<body>
  <header>
    <button id="sidebar-toggle" aria-label="Toggle object list">☰</button>
    <span class="logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
        <path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </span>
    <h1>Situation Map</h1>
    <span class="status" id="status"><span class="dot"></span>loading…</span>
  </header>
  <main>
    <div id="map"></div>
    <div id="backdrop"></div>
    <div id="sidebar">
      <div id="filters">
        <input id="search" type="search" placeholder="Filter by name or id…" aria-label="Filter by name or id">
        <div id="type-chips"></div>
      </div>
      <div class="count" id="count">0 objects</div>
      <div id="object-list"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/milsymbol@2.0.0/dist/milsymbol.js"
          integrity="sha256-KikhGmSm8kBLnFSWJN3w1z7dm6gFdKYiE1o1BcvifxM=" crossorigin="anonymous"></script>
  <script>
    let REFRESH_MS = 2000;

    // Fixed color per situation object type, so the same kind of object always
    // reads the same on the map, in chips, and in the sidebar.
    const TYPE_COLORS = {
      Symbol: '#4da3ff',
      ActionTask: '#f5a623',
      ActionEvent: '#ff5b5b',
      OrganizationUnit: '#9b59b6',
      Route: '#2ecc71',
      TextDocument: '#8b93a1',
      PictureDocument: '#c77dff',
      VoiceMessageDocument: '#17c3b2',
      NatoMessageDocument: '#b08968',
      OverlayDocument: '#5c6bc0',
      SketchDocument: '#e0d000'
    };
    const DEFAULT_COLOR = '#4da3ff';
    const colorFor = (type) => TYPE_COLORS[type] || DEFAULT_COLOR;

    const STATUS_COLORS = {
      NotStarted: '#8b93a1',
      InProgress: '#22d3ee',
      Complete: '#2ecc71',
      Aborted: '#ff5b5b',
      Cancelled: '#ff5b5b',
      Delayed: '#f5a623',
      Paused: '#f5a623'
    };

    // --- Filter state, kept across polls so toggling a chip doesn't need to wait for the next fetch.
    const hiddenTypes = new Set();
    let searchQuery = '';
    let lastObjects = [];
    let expandedId = null;

    // --- Mobile sidebar (off-canvas overlay below 820px, see media query).
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const backdrop = document.getElementById('backdrop');
    function openSidebar() { document.body.classList.add('sidebar-open'); }
    function closeSidebar() { document.body.classList.remove('sidebar-open'); }
    sidebarToggle.addEventListener('click', () => document.body.classList.toggle('sidebar-open'));
    backdrop.addEventListener('click', closeSidebar);
    window.addEventListener('resize', () => map.invalidateSize());

    // --- Map setup - a dark basemap to match the panel theme.
    const map = L.map('map', { worldCopyJump: true }).setView([53.08, 8.80], 9);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);

    const layerGroup = L.layerGroup().addTo(map);
    let hasFittedBounds = false;
    const markersById = new Map();

    // --- Selection linking: clicking a sidebar row highlights its marker/shape on the map, and
    // clicking a marker/shape highlights (and scrolls to) its sidebar row. Both directions funnel
    // through `expandedId` plus this pulsing halo, so there's exactly one notion of "selected".
    let highlightLayer = null;
    function pointFor(obj) {
      const loc = obj.location;
      if (!loc) return null;
      if (loc.points && loc.points.length > 0) return [loc.points[0].lat, loc.points[0].lon];
      if (loc.elements && loc.elements.length > 0 && loc.elements[0].points.length > 0) {
        const p = loc.elements[0].points[0];
        return [p.lat, p.lon];
      }
      return null;
    }
    function clearHighlight() {
      if (highlightLayer) {
        map.removeLayer(highlightLayer);
        highlightLayer = null;
      }
    }
    // Places the pulsing halo without moving the map - used on every re-render so the highlight
    // stays glued to a (possibly moving) selected object.
    function placeHighlight(obj) {
      clearHighlight();
      const point = obj && pointFor(obj);
      if (!point) return;
      highlightLayer = L.marker(point, {
        icon: L.divIcon({
          html: '<div class="pulse-marker"><div class="ring"></div><div class="core"></div></div>',
          className: '', iconSize: [22, 22], iconAnchor: [11, 11]
        }),
        interactive: false, zIndexOffset: 1000
      }).addTo(map);
    }
    // Places the halo AND brings it into view - used when the user actively selects something.
    function drawHighlight(obj) {
      const point = pointFor(obj);
      if (point && !map.getBounds().contains(point)) map.panTo(point, { animate: true });
      placeHighlight(obj);
    }
    function selectFromMap(obj) {
      expandedId = obj.id;
      renderSidebar(lastObjects.filter(matchesFilter));
      scrollRowIntoView(obj.id);
      drawHighlight(obj);
      openSidebar();
    }
    function scrollRowIntoView(id) {
      const row = document.querySelector(`.row[data-id="${id}"]`);
      if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    // --- Great-circle geometry helpers, mirroring the server-side math, so fans/ellipses/
    // corridors drawn from range+bearing data come out correctly shaped in real-world meters.
    const EARTH_RADIUS_M = 6371000;
    function destination(lat, lon, bearingDeg, distanceM) {
      const angularDistance = distanceM / EARTH_RADIUS_M;
      const bearing = (bearingDeg * Math.PI) / 180;
      const lat1 = (lat * Math.PI) / 180;
      const lon1 = (lon * Math.PI) / 180;
      const lat2 = Math.asin(Math.sin(lat1) * Math.cos(angularDistance) +
        Math.cos(lat1) * Math.sin(angularDistance) * Math.cos(bearing));
      const lon2 = lon1 + Math.atan2(
        Math.sin(bearing) * Math.sin(angularDistance) * Math.cos(lat1),
        Math.cos(angularDistance) - Math.sin(lat1) * Math.sin(lat2));
      return [(lat2 * 180) / Math.PI, (lon2 * 180) / Math.PI];
    }
    function bearingBetween(a, b) {
      const lat1 = (a.lat * Math.PI) / 180;
      const lat2 = (b.lat * Math.PI) / 180;
      const dLon = ((b.lon - a.lon) * Math.PI) / 180;
      const y = Math.sin(dLon) * Math.cos(lat2);
      const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
      return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
    }

    function fanPolygon(loc) {
      const vertex = loc.points[0];
      const minR = loc.minRangeM || 0;
      const maxR = loc.maxRangeM || Math.max(minR, 100);
      const start = loc.orientationDeg || 0;
      const sector = loc.sectorDeg || 30;
      const steps = Math.max(8, Math.round(sector / 5));
      const outer = [];
      for (let i = 0; i <= steps; i++) outer.push(destination(vertex.lat, vertex.lon, start + (sector * i) / steps, maxR));
      if (minR > 0) {
        const inner = [];
        for (let i = steps; i >= 0; i--) inner.push(destination(vertex.lat, vertex.lon, start + (sector * i) / steps, minR));
        return outer.concat(inner);
      }
      return [[vertex.lat, vertex.lon], ...outer];
    }

    function ellipsePolygon(loc) {
      const center = loc.points[0];
      const a = loc.semiMajorM, b = loc.semiMinorM, orientation = loc.orientationDeg || 0;
      const steps = 32;
      const pts = [];
      for (let i = 0; i < steps; i++) {
        const t = (360 * i) / steps;
        const rad = (t * Math.PI) / 180;
        const r = (a * b) / Math.sqrt((b * Math.cos(rad)) ** 2 + (a * Math.sin(rad)) ** 2);
        pts.push(destination(center.lat, center.lon, orientation + t, r));
      }
      return pts;
    }

    function corridorPolygon(loc) {
      const pts = loc.points;
      const halfWidth = (loc.widthM || 100) / 2;
      const left = [];
      const right = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[Math.max(i - 1, 0)];
        const b = pts[Math.min(i + 1, pts.length - 1)];
        const bearing = bearingBetween(a, b);
        left.push(destination(pts[i].lat, pts[i].lon, bearing + 90, halfWidth));
        right.push(destination(pts[i].lat, pts[i].lon, bearing - 90, halfWidth));
      }
      return left.concat(right.reverse());
    }

    // --- MIL-STD-2525/APP-6 symbol rendering (best-effort - falls back to a plain marker
    // whenever milsymbol isn't loaded or can't parse the code). Icons are cached by SIDC since
    // the same code is typically reused across many objects (e.g. one live-tracker code for a
    // whole fleet of aircraft).
    const iconCache = new Map();
    function symbolIcon(symbolIdentifier) {
      if (!symbolIdentifier || typeof ms === 'undefined') return null;
      const cacheKey = symbolIdentifier.sidc;
      if (iconCache.has(cacheKey)) return iconCache.get(cacheKey);

      let icon = null;
      try {
        const symbol = new ms.Symbol(symbolIdentifier.sidc, { size: 26 });
        if (symbol && symbol.asSVG) {
          const size = symbol.getSize();
          const anchor = symbol.getAnchor();
          icon = L.divIcon({
            html: symbol.asSVG(),
            className: 'milsymbol-icon',
            iconSize: [size.width, size.height],
            iconAnchor: [anchor.x, anchor.y]
          });
        }
      } catch (err) {
        icon = null;
      }
      iconCache.set(cacheKey, icon);
      return icon;
    }
    function symbolSvgSnippet(symbolIdentifier) {
      if (!symbolIdentifier || typeof ms === 'undefined') return null;
      try {
        const symbol = new ms.Symbol(symbolIdentifier.sidc, { size: 16 });
        return symbol && symbol.asSVG ? symbol.asSVG() : null;
      } catch (err) {
        return null;
      }
    }

    // --- ActionTask gets a small radial progress-ring marker instead of a plain dot.
    function taskRingIcon(obj) {
      const completion = parseCompletion(obj);
      if (completion === null) return null;
      const color = STATUS_COLORS[obj.details?.Status] || colorFor(obj.type);
      const deg = Math.max(completion, 2) * 3.6;
      const html = `<div class="ring" style="background:conic-gradient(${color} ${deg}deg, rgba(255,255,255,0.15) ${deg}deg)"><div class="hub"></div></div>`;
      return L.divIcon({ html, className: 'task-ring-icon', iconSize: [24, 24], iconAnchor: [12, 12] });
    }
    function parseCompletion(obj) {
      const raw = obj.details?.Completion;
      if (!raw) return null;
      const value = parseFloat(raw);
      return Number.isFinite(value) ? value : null;
    }

    function waypointIcon(label) {
      return L.divIcon({
        html: `<div class="waypoint-badge" style="width:${Math.max(20, label.length * 7)}px">${escapeHtml(label)}</div>`,
        className: '',
        iconSize: [Math.max(20, label.length * 7), 18],
        iconAnchor: [Math.max(20, label.length * 7) / 2, 9]
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    function detailsHtml(obj) {
      const entries = Object.entries(obj.details || {});
      if (entries.length === 0) return '';
      const rows = entries.map(([label, value]) =>
        `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`).join('');
      return `<dl>${rows}</dl>`;
    }

    function popupHtml(obj) {
      const lines = [`<div class="popup"><div class="type">${escapeHtml(obj.type)}</div>`];
      if (obj.name) lines.push(`<div class="name">${escapeHtml(obj.name)}</div>`);
      if (obj.additionalInformation) lines.push(`<div class="field">${escapeHtml(obj.additionalInformation)}</div>`);
      lines.push(`<div class="field">${escapeHtml(obj.id)}</div>`);
      const details = detailsHtml(obj);
      if (details) lines.push(`<div class="details">${details}</div>`);
      lines.push('</div>');
      return lines.join('');
    }

    function waypointPopupHtml(point, routeName) {
      const lines = [`<div class="popup"><div class="type">Waypoint</div>`,
        `<div class="name">${escapeHtml(point.name || '')} - ${escapeHtml(routeName)}</div>`];
      if (point.comment) lines.push(`<div class="field">${escapeHtml(point.comment)}</div>`);
      if (point.arrivalTime) lines.push(`<div class="field">ETA ${new Date(point.arrivalTime).toLocaleTimeString()}</div>`);
      if (point.travelTimeSeconds) lines.push(`<div class="field">${Math.round(point.travelTimeSeconds / 60)} min from previous checkpoint</div>`);
      lines.push('</div>');
      return lines.join('');
    }

    // --- Filtering.
    function matchesFilter(obj) {
      if (hiddenTypes.has(obj.type)) return false;
      if (!searchQuery) return true;
      const haystack = `${obj.name || ''} ${obj.id}`.toLowerCase();
      return haystack.includes(searchQuery);
    }

    function buildFilterChips() {
      const container = document.getElementById('type-chips');
      container.innerHTML = '';
      for (const type of Object.keys(TYPE_COLORS)) {
        const chip = document.createElement('button');
        chip.className = 'chip active';
        chip.innerHTML = `<span class="dot" style="background:${TYPE_COLORS[type]}"></span>${type}`;
        chip.addEventListener('click', () => {
          if (hiddenTypes.has(type)) hiddenTypes.delete(type); else hiddenTypes.add(type);
          chip.classList.toggle('active', !hiddenTypes.has(type));
          renderAll();
        });
        container.appendChild(chip);
      }
    }

    document.getElementById('search').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderAll();
    });

    function renderAll() {
      const filtered = lastObjects.filter(matchesFilter);
      renderMap(filtered);
      renderSidebar(filtered);
    }

    // Binds the popup and the sidebar-selection link to a layer in one place, so every shape
    // (not just the "primary" one) responds to a click the same way.
    function bindInteraction(layer, obj) {
      layer.bindPopup(popupHtml(obj));
      layer.on('click', () => selectFromMap(obj));
      return layer;
    }

    function renderMap(objects) {
      layerGroup.clearLayers();
      markersById.clear();

      const bounds = [];
      for (const obj of objects) {
        const loc = obj.location;
        if (!loc) continue;
        const color = colorFor(obj.type);
        let primaryLayer = null;

        if (loc.kind === 'point' || loc.kind === 'ellipse' || loc.kind === 'fan') {
          if (loc.kind === 'point') {
            const icon = obj.type === 'ActionTask' ? taskRingIcon(obj) : symbolIcon(obj.symbolIdentifier);
            primaryLayer = icon
              ? L.marker([loc.points[0].lat, loc.points[0].lon], { icon })
              : L.circleMarker([loc.points[0].lat, loc.points[0].lon], { radius: 6, color, fillColor: color, fillOpacity: 0.85, weight: 2 });
            bindInteraction(primaryLayer, obj).addTo(layerGroup);
            bounds.push([loc.points[0].lat, loc.points[0].lon]);
          } else {
            const latlngs = loc.kind === 'fan' ? fanPolygon(loc) : ellipsePolygon(loc);
            primaryLayer = L.polygon(latlngs, { color, weight: 2, fillColor: color, fillOpacity: 0.22, dashArray: '4 3' });
            bindInteraction(primaryLayer, obj).addTo(layerGroup);
            L.circleMarker([loc.points[0].lat, loc.points[0].lon], { radius: 3, color, fillColor: color, fillOpacity: 1 })
              .addTo(layerGroup);
            latlngs.forEach((p) => bounds.push(p));
          }
        } else if (loc.kind === 'multipoint') {
          primaryLayer = L.layerGroup(loc.points.map((p) =>
            bindInteraction(L.circleMarker([p.lat, p.lon], { radius: 5, color, fillColor: color, fillOpacity: 0.9 }), obj)));
          primaryLayer.addTo(layerGroup);
          loc.points.forEach((p) => bounds.push([p.lat, p.lon]));
        } else if (loc.kind === 'corridor') {
          const polygon = corridorPolygon(loc);
          primaryLayer = L.polygon(polygon, { color, weight: 1, fillColor: color, fillOpacity: 0.15, dashArray: '2 6' });
          bindInteraction(primaryLayer, obj).addTo(layerGroup);
          bindInteraction(
            L.polyline(loc.points.map((p) => [p.lat, p.lon]), { color, weight: 2, dashArray: '10 8', className: 'flow-line' }),
            obj
          ).addTo(layerGroup);
          loc.points.forEach((p) => bounds.push([p.lat, p.lon]));
        } else if (loc.kind === 'polygon') {
          primaryLayer = L.polygon(loc.points.map((p) => [p.lat, p.lon]), { color, weight: 2, fillOpacity: 0.18 });
          bindInteraction(primaryLayer, obj).addTo(layerGroup);
          loc.points.forEach((p) => bounds.push([p.lat, p.lon]));
        } else if (loc.kind === 'route') {
          const latlngs = loc.points.map((p) => [p.lat, p.lon]);
          primaryLayer = L.polyline(latlngs, { color, weight: 3, dashArray: '9 7', className: 'flow-line' });
          bindInteraction(primaryLayer, obj).addTo(layerGroup);
          const seenWaypoints = new Set();
          loc.points.forEach((p) => {
            if (!p.name) return;
            const key = `${p.name}@${p.lat},${p.lon}`;
            if (seenWaypoints.has(key)) return; // a closed loop repeats its first waypoint last
            seenWaypoints.add(key);
            const marker = L.marker([p.lat, p.lon], { icon: waypointIcon(p.name) });
            marker.bindPopup(waypointPopupHtml(p, obj.name || obj.type));
            marker.on('click', () => selectFromMap(obj));
            marker.addTo(layerGroup);
          });
          latlngs.forEach((p) => bounds.push(p));
        } else if (loc.kind === 'sketch') {
          const group = L.featureGroup();
          (loc.elements || []).forEach((el) => {
            const elColor = el.color || color;
            const dash = el.lineStyle === 'Dash' ? '8 6' : el.lineStyle === 'Dot' ? '2 5' : null;
            const latlngs = el.points.map((p) => [p.lat, p.lon]);
            let layer;
            if (el.kind === 'polygon') {
              layer = L.polygon(latlngs, {
                color: elColor, weight: 2, dashArray: dash,
                fillOpacity: el.fillStyle && el.fillStyle !== 'None' ? 0.18 : 0
              });
            } else if (el.kind === 'point') {
              layer = L.circleMarker(latlngs[0], { radius: 6, color: elColor, fillColor: elColor, fillOpacity: 0.9 });
            } else {
              layer = L.polyline(latlngs, { color: elColor, weight: 3, dashArray: dash });
            }
            bindInteraction(layer, obj).addTo(group);
            latlngs.forEach((p) => bounds.push(p));
          });
          group.addTo(layerGroup);
          primaryLayer = group;
        } else {
          primaryLayer = L.polyline(loc.points.map((p) => [p.lat, p.lon]), { color, weight: 3 });
          bindInteraction(primaryLayer, obj).addTo(layerGroup);
          loc.points.forEach((p) => bounds.push([p.lat, p.lon]));
        }

        if (primaryLayer && primaryLayer !== layerGroup) markersById.set(obj.id, primaryLayer);
      }

      if (!hasFittedBounds && bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
        hasFittedBounds = true;
      }

      placeHighlight(expandedId ? objects.find((o) => o.id === expandedId) : null);
    }

    function locateOnMap(obj) {
      const layer = markersById.get(obj.id);
      if (!layer) return;
      const target = layer.getBounds ? layer.getBounds() : layer.getLatLng();
      map.flyTo(target.pad ? target.getCenter() : target, Math.max(map.getZoom(), 11));
      (layer.openPopup ? layer : layer.getLayers()[0]).openPopup();
      closeSidebar();
    }

    function progressHtml(obj) {
      const completion = parseCompletion(obj);
      if (completion === null) return '';
      const status = obj.details?.Status || '';
      const color = STATUS_COLORS[status] || 'var(--accent)';
      return `<div class="row-progress">
        <div class="bar"><span style="width:${completion}%;background:${color}"></span></div>
        <span class="pill" style="color:${color};background:${color}22">${escapeHtml(status || completion + '%')}</span>
      </div>`;
    }

    function renderSidebar(objects) {
      document.getElementById('count').textContent =
        `${objects.length} object${objects.length === 1 ? '' : 's'}`;

      const list = document.getElementById('object-list');
      list.innerHTML = '';
      const sorted = [...objects].sort((a, b) =>
        a.type.localeCompare(b.type) || (a.name || '').localeCompare(b.name || ''));

      for (const obj of sorted) {
        const row = document.createElement('div');
        row.className = expandedId === obj.id ? 'row selected' : 'row';
        row.dataset.id = obj.id;

        const hasLocation = markersById.has(obj.id);
        const svgSnippet = symbolSvgSnippet(obj.symbolIdentifier);

        const main = document.createElement('div');
        main.className = 'row-main';
        main.innerHTML =
          (svgSnippet ? `<span class="row-symbol">${svgSnippet}</span>` : `<span class="type-dot" style="background:${colorFor(obj.type)}"></span>`) +
          `<span class="type-label">${escapeHtml(obj.type)}</span>` +
          `<span class="name">${escapeHtml(obj.name || '(unnamed)')}</span>` +
          (hasLocation ? '<button class="locate" title="Show on map">📍</button>' : '');
        main.addEventListener('click', () => {
          const wasSelected = expandedId === obj.id;
          expandedId = wasSelected ? null : obj.id;
          renderSidebar(lastObjects.filter(matchesFilter));
          if (wasSelected) clearHighlight(); else if (hasLocation) drawHighlight(obj);
        });
        row.appendChild(main);

        if (hasLocation) {
          main.querySelector('.locate').addEventListener('click', (e) => {
            e.stopPropagation();
            locateOnMap(obj);
          });
        }

        const idLine = document.createElement('div');
        idLine.className = 'row-id';
        idLine.textContent = obj.id;
        row.appendChild(idLine);

        if (obj.type === 'ActionTask') {
          const progress = document.createElement('div');
          progress.innerHTML = progressHtml(obj);
          if (progress.firstChild) row.appendChild(progress.firstChild);
        }

        if (expandedId === obj.id) {
          const details = document.createElement('div');
          details.className = 'row-details';
          details.innerHTML = detailsHtml(obj) || '<dt>No details</dt><dd>—</dd>';
          row.appendChild(details);
        }

        list.appendChild(row);
      }
    }

    async function refresh() {
      const status = document.getElementById('status');
      try {
        const response = await fetch('/api/objects');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        lastObjects = await response.json();
        renderAll();
        status.innerHTML = `<span class="dot"></span>updated ${new Date().toLocaleTimeString()}`;
        status.classList.remove('error');
      } catch (err) {
        status.innerHTML = `<span class="dot"></span>error: ${escapeHtml(err.message)}`;
        status.classList.add('error');
      }
    }

    async function init() {
      try {
        const config = await (await fetch('/api/config')).json();
        if (config.refreshMs) REFRESH_MS = config.refreshMs;
        if (config.defaultCenter) map.setView([config.defaultCenter.lat, config.defaultCenter.lon], config.defaultZoom);
      } catch (err) {
        // /api/config unavailable - keep the built-in defaults.
      }

      buildFilterChips();
      refresh();
      setInterval(refresh, REFRESH_MS);
    }

    init();
  </script>
</body>
</html>
