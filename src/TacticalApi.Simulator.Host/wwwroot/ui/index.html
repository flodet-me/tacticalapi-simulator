<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TacticalAPI Simulator — Situation Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      --bg: #0f1216;
      --panel: #171b21;
      --border: #2a2f38;
      --text: #d7dbe0;
      --muted: #8b93a1;
      --accent: #4da3ff;
      --sidebar-width: 340px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }
    header h1 { font-size: 1rem; font-weight: 600; margin: 0; }
    header .status { margin-left: auto; font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
    header .status.error { color: #ff6b6b; }
    #sidebar-toggle {
      display: none;
      appearance: none;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      font-size: 1rem;
      line-height: 1;
      padding: 0.35rem 0.55rem;
      cursor: pointer;
    }
    main { flex: 1; display: flex; min-height: 0; position: relative; }
    #map { flex: 1; }
    #backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 900;
    }
    #sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid var(--border);
      overflow: hidden;
    }
    #filters {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    #search {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      padding: 0.35rem 0.5rem;
      font-size: 0.82rem;
    }
    #type-chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .chip {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
      cursor: pointer;
      color: #0f1216;
      opacity: 0.35;
      border: none;
      user-select: none;
    }
    .chip.active { opacity: 1; }
    #sidebar .count { padding: 0.5rem 0.8rem; font-size: 0.8rem; color: var(--muted); border-bottom: 1px solid var(--border); }
    #object-list { flex: 1; overflow-y: auto; }
    .row { border-bottom: 1px solid var(--border); font-size: 0.82rem; }
    .row-main { display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.8rem; }
    .row-main.clickable { cursor: pointer; }
    .row-main.clickable:hover { background: #1f2530; }
    .row-symbol { flex-shrink: 0; width: 20px; height: 20px; }
    .row-symbol svg { width: 100%; height: 100%; }
    .row .type {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.05rem 0.4rem;
      border-radius: 3px;
      color: #0f1216;
      flex-shrink: 0;
    }
    .row .name { color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .locate {
      flex-shrink: 0;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.1rem 0.3rem;
    }
    .row .locate:hover { color: var(--accent); }
    .row-id { color: var(--muted); font-size: 0.72rem; padding: 0 0.8rem 0.4rem 0.8rem; }
    .row-details {
      padding: 0 0.8rem 0.6rem 0.8rem;
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.15rem 0.6rem;
      font-size: 0.78rem;
    }
    .row-details dt { color: var(--muted); }
    .row-details dd { margin: 0; word-break: break-word; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text); }
    .leaflet-container { background: #0b0d10; }
    .popup .type { font-weight: 600; }
    .popup .field { color: var(--muted); font-size: 0.82rem; }
    .popup .details { max-height: 180px; overflow-y: auto; margin-top: 0.4rem; }
    .popup .details dt { color: var(--muted); font-size: 0.75rem; }
    .popup .details dd { margin: 0 0 0.3rem 0; font-size: 0.8rem; }
    .milsymbol-icon { background: transparent; border: none; }

    @media (max-width: 820px) {
      #sidebar-toggle { display: inline-block; }
      main { position: relative; }
      #sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(88vw, 380px);
        transform: translateX(100%);
        transition: transform 0.25s ease;
        z-index: 950;
        box-shadow: -6px 0 16px rgba(0, 0, 0, 0.5);
      }
      body.sidebar-open #sidebar { transform: translateX(0); }
      body.sidebar-open #backdrop { display: block; }
    }
  </style>
</head>
<body>
  <header>
    <button id="sidebar-toggle" aria-label="Toggle object list">☰</button>
    <h1>Situation Map</h1>
    <span class="status" id="status">loading…</span>
  </header>
  <main>
    <div id="map"></div>
    <div id="backdrop"></div>
    <div id="sidebar">
      <div id="filters">
        <input id="search" type="search" placeholder="Filter by name or id…" aria-label="Filter by name or id">
        <div id="type-chips"></div>
      </div>
      <div class="count" id="count">0 objects</div>
      <div id="object-list"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/milsymbol@2.0.0/dist/milsymbol.js"
          integrity="sha256-KikhGmSm8kBLnFSWJN3w1z7dm6gFdKYiE1o1BcvifxM=" crossorigin=""></script>
  <script>
    const REFRESH_MS = 2000;

    // Fixed color per situation object type, so the same kind of object always
    // reads the same on the map, in chips, and in the sidebar.
    const TYPE_COLORS = {
      Symbol: '#4da3ff',
      ActionTask: '#f5a623',
      ActionEvent: '#ff5b5b',
      OrganizationUnit: '#9b59b6',
      Route: '#2ecc71',
      TextDocument: '#8b93a1',
      PictureDocument: '#c77dff',
      VoiceMessageDocument: '#17c3b2',
      NatoMessageDocument: '#b08968',
      OverlayDocument: '#5c6bc0',
      SketchDocument: '#e0d000'
    };
    const DEFAULT_COLOR = '#4da3ff';
    const colorFor = (type) => TYPE_COLORS[type] || DEFAULT_COLOR;

    // --- Filter state, kept across polls so toggling a chip doesn't need to wait for the next fetch.
    const hiddenTypes = new Set();
    let searchQuery = '';
    let lastObjects = [];
    let expandedId = null;

    // --- Mobile sidebar (off-canvas overlay below 820px, see media query).
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const backdrop = document.getElementById('backdrop');
    function openSidebar() { document.body.classList.add('sidebar-open'); }
    function closeSidebar() { document.body.classList.remove('sidebar-open'); }
    sidebarToggle.addEventListener('click', () => document.body.classList.toggle('sidebar-open'));
    backdrop.addEventListener('click', closeSidebar);
    window.addEventListener('resize', () => map.invalidateSize());

    // --- Map setup.
    const map = L.map('map', { worldCopyJump: true }).setView([53.08, 8.80], 9);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const layerGroup = L.layerGroup().addTo(map);
    let hasFittedBounds = false;
    const markersById = new Map();

    // --- MIL-STD-2525/APP-6 symbol rendering (best-effort - falls back to a plain marker
    // whenever milsymbol isn't loaded or can't parse the code). Icons are cached by SIDC since
    // the same code is typically reused across many objects (e.g. one live-tracker code for a
    // whole fleet of aircraft).
    const iconCache = new Map();
    function symbolIcon(symbolIdentifier) {
      if (!symbolIdentifier || typeof ms === 'undefined') return null;
      const cacheKey = symbolIdentifier.sidc;
      if (iconCache.has(cacheKey)) return iconCache.get(cacheKey);

      let icon = null;
      try {
        const symbol = new ms.Symbol(symbolIdentifier.sidc, { size: 26 });
        if (symbol && symbol.asSVG) {
          const size = symbol.getSize();
          const anchor = symbol.getAnchor();
          icon = L.divIcon({
            html: symbol.asSVG(),
            className: 'milsymbol-icon',
            iconSize: [size.width, size.height],
            iconAnchor: [anchor.x, anchor.y]
          });
        }
      } catch (err) {
        icon = null;
      }
      iconCache.set(cacheKey, icon);
      return icon;
    }
    function symbolSvgSnippet(symbolIdentifier) {
      if (!symbolIdentifier || typeof ms === 'undefined') return null;
      try {
        const symbol = new ms.Symbol(symbolIdentifier.sidc, { size: 16 });
        return symbol && symbol.asSVG ? symbol.asSVG() : null;
      } catch (err) {
        return null;
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    function detailsHtml(obj) {
      const entries = Object.entries(obj.details || {});
      if (entries.length === 0) return '';
      const rows = entries.map(([label, value]) =>
        `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`).join('');
      return `<dl>${rows}</dl>`;
    }

    function popupHtml(obj) {
      const lines = [`<div class="popup"><div class="type">${escapeHtml(obj.type)}</div>`];
      if (obj.name) lines.push(`<div>${escapeHtml(obj.name)}</div>`);
      if (obj.additionalInformation) lines.push(`<div class="field">${escapeHtml(obj.additionalInformation)}</div>`);
      lines.push(`<div class="field">${escapeHtml(obj.id)}</div>`);
      const details = detailsHtml(obj);
      if (details) lines.push(`<div class="details">${details}</div>`);
      lines.push('</div>');
      return lines.join('');
    }

    // --- Filtering.
    function matchesFilter(obj) {
      if (hiddenTypes.has(obj.type)) return false;
      if (!searchQuery) return true;
      const haystack = `${obj.name || ''} ${obj.id}`.toLowerCase();
      return haystack.includes(searchQuery);
    }

    function buildFilterChips() {
      const container = document.getElementById('type-chips');
      container.innerHTML = '';
      for (const type of Object.keys(TYPE_COLORS)) {
        const chip = document.createElement('button');
        chip.className = 'chip active';
        chip.textContent = type;
        chip.style.background = TYPE_COLORS[type];
        chip.addEventListener('click', () => {
          if (hiddenTypes.has(type)) hiddenTypes.delete(type); else hiddenTypes.add(type);
          chip.classList.toggle('active', !hiddenTypes.has(type));
          renderAll();
        });
        container.appendChild(chip);
      }
    }

    document.getElementById('search').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderAll();
    });

    function renderAll() {
      const filtered = lastObjects.filter(matchesFilter);
      renderMap(filtered);
      renderSidebar(filtered);
    }

    function renderMap(objects) {
      layerGroup.clearLayers();
      markersById.clear();

      const bounds = [];
      for (const obj of objects) {
        const loc = obj.location;
        if (!loc || loc.points.length === 0) continue;

        const color = colorFor(obj.type);
        const latlngs = loc.points.map((p) => [p.lat, p.lon]);
        let layer;

        if (loc.kind === 'point' || loc.kind === 'ellipse' || loc.kind === 'fan') {
          const icon = symbolIcon(obj.symbolIdentifier);
          layer = icon
            ? L.marker(latlngs[0], { icon })
            : L.circleMarker(latlngs[0], { radius: 6, color, fillColor: color, fillOpacity: 0.85, weight: 2 });
        } else if (loc.kind === 'multipoint') {
          layer = L.layerGroup(latlngs.map((ll) => L.circleMarker(ll, { radius: 5, color, fillColor: color, fillOpacity: 0.85 })));
        } else if (loc.kind === 'polygon') {
          layer = L.polygon(latlngs, { color, weight: 2, fillOpacity: 0.15 });
        } else {
          layer = L.polyline(latlngs, { color, weight: 3 });
        }

        layer.bindPopup(popupHtml(obj));
        layer.addTo(layerGroup);
        markersById.set(obj.id, layer);
        bounds.push(...latlngs);
      }

      if (!hasFittedBounds && bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
        hasFittedBounds = true;
      }
    }

    function locateOnMap(obj) {
      const layer = markersById.get(obj.id);
      if (!layer) return;
      const target = layer.getBounds ? layer.getBounds() : layer.getLatLng();
      map.flyTo(target.pad ? target.getCenter() : target, Math.max(map.getZoom(), 11));
      (layer.openPopup ? layer : layer.getLayers()[0]).openPopup();
      closeSidebar();
    }

    function renderSidebar(objects) {
      document.getElementById('count').textContent =
        `${objects.length} object${objects.length === 1 ? '' : 's'}`;

      const list = document.getElementById('object-list');
      list.innerHTML = '';
      const sorted = [...objects].sort((a, b) =>
        a.type.localeCompare(b.type) || (a.name || '').localeCompare(b.name || ''));

      for (const obj of sorted) {
        const row = document.createElement('div');
        row.className = 'row';

        const hasLocation = markersById.has(obj.id);
        const svgSnippet = symbolSvgSnippet(obj.symbolIdentifier);

        const main = document.createElement('div');
        main.className = 'row-main clickable';
        main.innerHTML =
          (svgSnippet ? `<span class="row-symbol">${svgSnippet}</span>` : '') +
          `<span class="type" style="background:${colorFor(obj.type)}">${escapeHtml(obj.type)}</span>` +
          `<span class="name">${escapeHtml(obj.name || '(unnamed)')}</span>` +
          (hasLocation ? '<button class="locate" title="Show on map">📍</button>' : '');
        main.addEventListener('click', () => {
          expandedId = expandedId === obj.id ? null : obj.id;
          renderSidebar(lastObjects.filter(matchesFilter));
        });
        row.appendChild(main);

        if (hasLocation) {
          main.querySelector('.locate').addEventListener('click', (e) => {
            e.stopPropagation();
            locateOnMap(obj);
          });
        }

        const idLine = document.createElement('div');
        idLine.className = 'row-id';
        idLine.textContent = obj.id;
        row.appendChild(idLine);

        if (expandedId === obj.id) {
          const details = document.createElement('div');
          details.className = 'row-details';
          details.innerHTML = detailsHtml(obj) || '<dt>No details</dt><dd>—</dd>';
          row.appendChild(details);
        }

        list.appendChild(row);
      }
    }

    async function refresh() {
      const status = document.getElementById('status');
      try {
        const response = await fetch('/api/objects');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        lastObjects = await response.json();
        renderAll();
        status.textContent = `updated ${new Date().toLocaleTimeString()}`;
        status.classList.remove('error');
      } catch (err) {
        status.textContent = `error: ${err.message}`;
        status.classList.add('error');
      }
    }

    buildFilterChips();
    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
